name: Produces and releases artifacts

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and run tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Setup JDK and .m2/settings.xml
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version-file: .java-version
          distribution: 'zulu'
          cache: maven
          server-id: central
          server-username: OSS_CENTRAL_USERNAME # env variable for Maven Central
          server-password: OSS_CENTRAL_PASSWORD # env variable for Maven Central

      # Prepare
      - name: Prepare Maven Wrapper
        run: chmod +x ./mvnw

      # Build
      - name: Build with Maven
        run: ./mvnw clean install -U -B -T4 -ntp

      # Make signing available to the release-profile verification build.
      - name: Import GPG Owner Trust
        run: echo "${{ secrets.GPG_OWNERTRUST }}" | base64 --decode | gpg --import-ownertrust

      - name: Import GPG key
        run: echo "${{ secrets.GPG_SECRET_KEYS }}" | base64 --decode | gpg --import --no-tty --batch --yes --always-trust

      - name: Extract parent version
        id: parent-version
        run: echo "value=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Exercise the example artifact lifecycle
        run: |
          for EXAMPLE in example example-hybrid; do
            ./mvnw -f "$EXAMPLE/pom.xml" clean deploy -Prelease -B -ntp \
              -Drevision="${{ steps.parent-version.outputs.value }}" \
              -Dgpg.keyname="${{ secrets.GPG_KEYNAME }}" \
              -DskipPublishing=true
          done
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # Publish release
      - name: Deploy a new release version to Maven Central
        run: ./mvnw clean deploy -B -ntp -Prelease -Dgpg.keyname="${{ secrets.GPG_KEYNAME }}"
        env:
          OSS_CENTRAL_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          OSS_CENTRAL_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
