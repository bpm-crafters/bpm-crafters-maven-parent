name: Development branches

permissions:
  contents: read

on:
  push:
    branches:
      - develop
      - release/*

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and run tests
    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Expose branch name
        run: echo ${{ github.ref }}

      # Setup JDK and Maven
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version-file: .java-version
          distribution: 'zulu'
          cache: maven

      # Prepare
      - name: Prepare Maven Wrapper
        run: chmod +x ./mvnw

      # Build
      - name: Build with Maven
        run: ./mvnw clean install -ntp -U -B -T4

      - name: Extract parent version
        id: parent-version
        run: echo "value=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Exercise the example artifact lifecycle
        run: |
          for EXAMPLE in example example-hybrid; do
            ./mvnw -f "$EXAMPLE/pom.xml" clean deploy -Prelease -B -ntp \
              -DREVISION="${{ steps.parent-version.outputs.value }}" \
              -Dgpg.skip=true \
              -DskipPublishing=true
          done
